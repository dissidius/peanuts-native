# Synced upstream Peanuts Native plus only the DualSense on-screen skin.
# Unlike UI smoke tests this uses the REAL upstream ARM64 on-device packer.
name: Peanuts Native DualSense Android APK
on:
  pull_request:
    paths:
      - 'android/app/src/main/java/dev/nxnative/android/TouchControls.java'
      - 'android/app/src/main/java/dev/nxnative/android/MainActivity.java'
      - '.github/workflows/dualsense-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      CI: 'true'
      UPSTREAM_APK: https://github.com/igawa6/peanuts-native/releases/download/v0.1.3-1/PeanutsNative-0.1.3.apk
      UPSTREAM_SHA256: 6b7be96e490c65199f8fc02c429e6be2f8cc75da3a891f3afdd081af48ce28e4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR=$(command -v sdkmanager); fi
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Restore original real on-device packer (checksum verified)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upstream" "$RUNNER_TEMP/real-stage/lib" "$RUNNER_TEMP/real-stage/python"
          curl -fL --retry 4 --connect-timeout 30 -o "$RUNNER_TEMP/upstream/PeanutsNative-0.1.3.apk" "$UPSTREAM_APK"
          printf '%s  %s\n' "$UPSTREAM_SHA256" "$RUNNER_TEMP/upstream/PeanutsNative-0.1.3.apk" | sha256sum -c -
          APK="$RUNNER_TEMP/upstream/PeanutsNative-0.1.3.apk"
          for lib in libpython3.14.so libnxpack.so libzbicdec.so libdmsh_xlate.so libSPIRV-Tools-shared.so; do
            unzip -p "$APK" "lib/arm64-v8a/$lib" > "$RUNNER_TEMP/real-stage/lib/$lib"
            test -s "$RUNNER_TEMP/real-stage/lib/$lib"
          done
          unzip -p "$APK" assets/pack/python.zip > "$RUNNER_TEMP/upstream/python.zip"
          unzip -q "$RUNNER_TEMP/upstream/python.zip" -d "$RUNNER_TEMP/real-stage/python"
          test -f "$RUNNER_TEMP/real-stage/python/lib/python3.14/os.py"
          python3 dm/gfx/tools/xlate_tree.py --check-lib "$RUNNER_TEMP/real-stage/lib/libdmsh_xlate.so"
          echo "NX_PACK_STAGE=$RUNNER_TEMP/real-stage" >> "$GITHUB_ENV"
      - name: Select all supported Android game profiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/config"
          for p in dm/games/*/readiness.tsv; do
            if grep -q '^status[[:space:]]' "$p"; then basename "$(dirname "$p")"; fi
          done | LC_ALL=C sort > "$RUNNER_TEMP/config/games.txt"
          echo "Android profiles:"
          cat "$RUNNER_TEMP/config/games.txt"
          if [ "$(wc -l < "$RUNNER_TEMP/config/games.txt")" -lt 7 ]; then
            echo "::error::Unexpectedly small profile catalog"
            exit 1
          fi
          echo "NX_GAMES_CSV=$(paste -sd, "$RUNNER_TEMP/config/games.txt")" >> "$GITHUB_ENV"
      - name: Build same-ID APK (cannot overwrite official signer)
        shell: bash
        run: |
          set -euo pipefail
          cd android/app
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PnxApp=peanuts -PnxGenericHost=true \
            "-PnxGames=$NX_GAMES_CSV" \
            "-PnxPackStage=$NX_PACK_STAGE" -PnxPackEngine=native \
            -PnxVersion=0.1.3-dualsense -PnxVersionCode=14 --stacktrace
          mkdir -p out
          cp build/outputs/apk/release/app-release.apk out/PeanutsNative-DualSense-same-package.apk
      - name: Build side-by-side app (original stays installed)
        shell: bash
        run: |
          set -euo pipefail
          cd android/app
          ./gradlew --no-daemon assembleRelease \
            -PnxApp=peanuts -PnxAppId=peanutsds -PnxLabel="Peanuts Native DualSense" \
            -PnxGenericHost=true "-PnxGames=$NX_GAMES_CSV" \
            "-PnxPackStage=$NX_PACK_STAGE" -PnxPackEngine=native \
            -PnxVersion=0.1.3-dualsense -PnxVersionCode=14 --stacktrace
          cp build/outputs/apk/release/app-release.apk out/PeanutsNative-DualSense-side-by-side.apk
      - name: Check real native packer and profile payloads in APKs
        shell: bash
        run: |
          set -euo pipefail
          for apk in android/app/out/PeanutsNative-DualSense-*.apk; do
            echo "--- $apk"
            du -h "$apk"
            for lib in libpython3.14.so libnxpack.so libzbicdec.so libdmsh_xlate.so libSPIRV-Tools-shared.so; do
              unzip -Z1 "$apk" | grep -Fx "lib/arm64-v8a/$lib"
            done
            unzip -Z1 "$apk" | grep -Fx 'assets/pack/python.zip'
            unzip -Z1 "$apk" | grep -Fx 'assets/pack/tools.zip'
            unzip -Z1 "$apk" | grep -Fx 'assets/pack/version.txt'
            unzip -Z1 "$apk" | grep -Fx 'classes.dex'
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PeanutsNative-v0.1.3-DualSense-REAL-ARM64-APKs
          path: android/app/out/PeanutsNative-DualSense-*.apk
          if-no-files-found: error
          retention-days: 14
